; sysPass's own "Session timeout" (Configuration > General, or the
; SYSPASS_DB_VERSION-independent per-instance config) is the real,
; precise, admin-configurable idle-session expiry - enforced in
; app/modules/web/Init.php's initUserSession(), which compares the
; session's own last-activity timestamp against that configured value
; on every request.
;
; PHP has its OWN, separate idle expiry for session files:
; session.gc_maxlifetime. The stock php:7.4-apache image defaults this
; to 1440 seconds (24 minutes) - Init.php tries to raise it to match
; the app's configured timeout via ini_set() on every request, but that
; never actually takes effect for any LATER request: ini_set() only
; affects the current request, and PHP starts fresh from php.ini on
; every single request in this shared-nothing (mod_php) model - so that
; call is a no-op in practice. Left at the 1440s default, PHP's garbage
; collector can silently delete a still-valid session file before
; sysPass's own, longer configured timeout would ever have expired it -
; sporadic early logouts, more noticeable the longer an admin sets the
; app-level timeout to (reported live: configured for 1800s, still
; logging out well before that).
;
; Set generous enough here that PHP's own GC is never the actual
; limiting factor for any reasonable app-level timeout an admin might
; configure - sysPass's own check above remains the one that actually
; decides when a session expires.
session.gc_maxlifetime = 86400
