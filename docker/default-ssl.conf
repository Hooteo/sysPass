<IfModule mod_ssl.c>
    <VirtualHost *:443>
        DocumentRoot /var/www/html/sysPass

        <Directory /var/www/html/sysPass>
            Options FollowSymLinks
            AllowOverride None
            Require all denied
        </Directory>

        <Directory /var/www/html/sysPass/public>
            Require all granted
        </Directory>

        <Files "index.php">
            Require all granted
        </Files>

        <Files "api.php">
            Require all granted
        </Files>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/syspass-selfsigned.crt
        SSLCertificateKeyFile /etc/ssl/private/syspass-selfsigned.key
    </VirtualHost>
</IfModule>
