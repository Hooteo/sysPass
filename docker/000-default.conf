<VirtualHost *:80>
    DocumentRoot /var/www/html/sysPass

    <Directory /var/www/html/sysPass>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/sysPass/(app|lib|schemas|tests|docker|\.git|\.github)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(composer\.(json|lock)|README\.md|SECURITY\.md|COPYING|INSTALL|Dockerfile|docker-compose\.yml|\.env.*|\.gitignore|\.dockerignore|\.travis\.yml)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
