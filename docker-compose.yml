version: '2'
services:
  app:
    container_name: syspass-app
    image: ghcr.io/hooteo/syspass:latest
    restart: always
    ports:
      # Fixed host ports instead of Docker picking a random free one each
      # time (what a plain "80"/"443" here would do) - change these two
      # numbers if they clash with something else already using them on
      # the host, nothing else in this file depends on the exact value.
      - "8099:80"
      - "8443:443"
    links:
      # Must match the database service's name below (syspass-db) - this
      # is what makes Docker's internal DNS resolve that hostname to the
      # database container from inside this one.
      - syspass-db
    volumes:
      - syspass-config:/var/www/html/sysPass/app/config
      - syspass-backup:/var/www/html/sysPass/app/backup
    environment:
      - USE_SSL=yes
      - SYSPASS_PASSWORD_SALT=${SYSPASS_PASSWORD_SALT}
      # The hostname sysPass connects to for the database. Must be the
      # NAME OF THE SERVICE BELOW (syspass-db), not its container_name -
      # those are two different things that happen to also be set to the
      # same value here on purpose, specifically to avoid the "which name
      # do I use" confusion: whichever one you see (in this file, in
      # `docker ps`, or in Portainer), it's the same string either way.
      - SYSPASS_DB_HOST=${SYSPASS_DB_HOST:-syspass-db}
      - SYSPASS_DB_PORT=${SYSPASS_DB_PORT:-3306}
      - SYSPASS_DB_NAME=${SYSPASS_DB_NAME}
      - SYSPASS_DB_USER=${SYSPASS_DB_USER}
      - SYSPASS_DB_PASS=${SYSPASS_DB_PASS}
      - SYSPASS_DB_VERSION=${SYSPASS_DB_VERSION}
      - SYSPASS_APP_VERSION=${SYSPASS_APP_VERSION}
      - SYSPASS_AUTO_MIGRATE=${SYSPASS_AUTO_MIGRATE:-yes}
      - SYSPASS_APPLICATION_URL=${SYSPASS_APPLICATION_URL}
  syspass-db:
    # Same value as the service name above on purpose - see the
    # SYSPASS_DB_HOST comment. Renaming just one of the two is exactly
    # what causes "unable to connect to db" after everything looks like
    # it started fine.
    container_name: syspass-db
    restart: always
    image: mariadb:10.2
    environment:
      - MYSQL_ROOT_PASSWORD=${SYSPASS_DB_ROOT_PASS}
      # Deliberately NOT setting MYSQL_DATABASE here. That variable makes
      # the mariadb image pre-create an empty schema with this name on
      # first boot - which then makes a FRESH install's own installer
      # wizard refuse with "The database already exists", since it
      # insists on creating that schema itself. The schema itself comes
      # either from the install wizard or from the dump you import (see
      # MIGRATION.md) - docker/db-grant-init.sh below grants this user
      # access to it either way, without pre-creating it.
      - MYSQL_USER=${SYSPASS_DB_USER}
      - MYSQL_PASSWORD=${SYSPASS_DB_PASS}
      # Only read by docker/db-grant-init.sh below - harmless to leave
      # set even with that line commented out.
      - SYSPASS_DB_NAME=${SYSPASS_DB_NAME}
    ports:
      - "3306"
    volumes:
      # This volume's own name is a separate thing from the service/
      # container name above (Docker keeps volume names and
      # container/service names in different namespaces) - it's just
      # where the data lives on disk. They happen to read the same here,
      # which is fine, not a conflict.
      - syspass-db:/var/lib/mysql
      # OPTIONAL, commented out by default - uncomment for a MIGRATION
      # (see MIGRATION.md), leave commented for a fresh install via the
      # wizard.
      #
      # Without MYSQL_DATABASE set above, MYSQL_USER/MYSQL_PASSWORD alone
      # create this DB user with GRANT USAGE only - no real access to
      # anything - until something else grants it properly. The install
      # wizard does that itself for a fresh install (it creates its own
      # separate sp_<hex> user, ignoring SYSPASS_DB_USER entirely), so
      # this isn't needed there. A migration, though, skips the wizard
      # and uses SYSPASS_DB_USER/NAME directly (see MIGRATION.md) - here
      # this line grants that exact user access to that exact database,
      # even before the schema exists (so it doesn't reintroduce "the
      # database already exists" either). Only runs once, the first time
      # this volume is empty (mariadb's own docker-entrypoint-initdb.d
      # convention) - has no effect on an already-initialized volume, so
      # it's safe to leave uncommented afterwards too.
      # - ./docker/db-grant-init.sh:/docker-entrypoint-initdb.d/db-grant-init.sh:ro

  # Cleartext password export for the disaster-recovery safe copy (see
  # scripts/password-export/README.md). Part of this same stack so it's
  # already on the same network and can reach syspass-db by name, but
  # `profiles` keeps it out of a normal `docker compose up` - it only
  # runs when you explicitly ask for it:
  #
  #   docker compose --profile tools build export-db-passwords
  #   mkdir -p export-output
  #   docker compose --profile tools run --rm export-db-passwords \
  #     --host syspass-db --db-user root --database syspass \
  #     --output /out/accounts_export.csv
  #
  # (`--rm` throws the container away after the run - the CSV itself
  # lands in ./export-output on the host via the volume below. Print it
  # and delete it from disk right after - see that README for the rest.)
  export-db-passwords:
    profiles: ["tools"]
    build: ./scripts/password-export
    links:
      - syspass-db
    volumes:
      - ./export-output:/out

volumes:
  syspass-config: {}
  syspass-backup: {}
  syspass-db: {}

# If MariaDB needs GRANTs scoped to a specific IP instead of '%' (some
# setups don't reliably match containers against '%'), give the app
# container a static IP on its own network instead of the default bridge
# one, then GRANT ... TO 'user'@'<that IP>' instead of 'user'@'%':
#
# networks:
#   syspass_net:
#     ipam:
#       config:
#         - subnet: 172.28.0.0/16
#
# services:
#   app:
#     networks:
#       syspass_net:
#         ipv4_address: 172.28.0.10
#   syspass-db:
#     networks:
#       syspass_net: {}
