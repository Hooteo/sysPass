version: '2'
services:
  app:
    container_name: syspass-app
    image: ghcr.io/hooteo/syspass:latest
    restart: always
    ports:
      - "80"
      - "443"
    links:
      - db
    volumes:
      - syspass-config:/var/www/html/sysPass/app/config
      - syspass-backup:/var/www/html/sysPass/app/backup
    environment:
      - USE_SSL=yes
      - SYSPASS_PASSWORD_SALT=${SYSPASS_PASSWORD_SALT}
      - SYSPASS_DB_HOST=${SYSPASS_DB_HOST:-db}
      - SYSPASS_DB_PORT=${SYSPASS_DB_PORT:-3306}
      - SYSPASS_DB_NAME=${SYSPASS_DB_NAME}
      - SYSPASS_DB_USER=${SYSPASS_DB_USER}
      - SYSPASS_DB_PASS=${SYSPASS_DB_PASS}
      - SYSPASS_DB_VERSION=${SYSPASS_DB_VERSION}
      - SYSPASS_APP_VERSION=${SYSPASS_APP_VERSION}
      - SYSPASS_AUTO_MIGRATE=${SYSPASS_AUTO_MIGRATE:-yes}
      - SYSPASS_APPLICATION_URL=${SYSPASS_APPLICATION_URL}
  db:
    container_name: syspass-db
    restart: always
    image: mariadb:10.2
    environment:
      - MYSQL_ROOT_PASSWORD=${SYSPASS_DB_ROOT_PASS}
      - MYSQL_DATABASE=${SYSPASS_DB_NAME}
      - MYSQL_USER=${SYSPASS_DB_USER}
      - MYSQL_PASSWORD=${SYSPASS_DB_PASS}
    ports:
      - "3306"
    volumes:
      - syspass-db:/var/lib/mysql

volumes:
  syspass-config: {}
  syspass-backup: {}
  syspass-db: {}

# If MariaDB needs GRANTs scoped to a specific IP instead of '%' (some
# setups don't reliably match containers against '%'), give the app
# container a static IP on its own network instead of the default bridge
# one, then GRANT ... TO 'user'@'<that IP>' instead of 'user'@'%':
#
# networks:
#   syspass_net:
#     ipam:
#       config:
#         - subnet: 172.28.0.0/16
#
# services:
#   app:
#     networks:
#       syspass_net:
#         ipv4_address: 172.28.0.10
#   db:
#     networks:
#       syspass_net: {}
